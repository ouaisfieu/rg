<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Parc d’Attractions du Centre – Muchtefion Land</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg1: #020617;
      --bg2: #0f172a;
      --bg3: #1e293b;
      --accent1: #22c55e;
      --accent2: #f97316;
      --accent3: #38bdf8;
      --accent4: #e879f9;
      --text: #f9fafb;
      --muted: #9ca3af;
      --card: rgba(15,23,42,0.9);
      --border: rgba(148,163,184,0.7);
      --radius: 18px;
      --shadow: 0 16px 40px rgba(0,0,0,0.55);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #22c55e22, transparent 55%),
        radial-gradient(circle at 100% 0%, #38bdf822, transparent 55%),
        radial-gradient(circle at 50% 100%, #e879f922, transparent 55%),
        linear-gradient(145deg, var(--bg1), var(--bg2), #020617);
      color:var(--text);
      overflow-x:hidden;
    }

    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(circle at 10% 20%, #22c55e22 0, transparent 55%),
        radial-gradient(circle at 90% 80%, #f9731622 0, transparent 55%);
      mix-blend-mode:screen;
      opacity:0.9;
      z-index:0;
    }

    header {
      position:sticky;
      top:0;
      z-index:40;
      background:rgba(15,23,42,0.9);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(148,163,184,0.3);
    }

    .topbar {
      max-width:1200px;
      margin:0 auto;
      padding:0.65rem 1.25rem;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:0.75rem;
    }

    .logo-pill {
      display:flex;
      align-items:center;
      gap:0.6rem;
    }

    .logo-orbit {
      width:40px;
      height:40px;
      border-radius:999px;
      background:
        conic-gradient(from 120deg, #22c55e, #38bdf8, #e879f9, #f97316, #22c55e);
      padding:2px;
      position:relative;
      animation:spin 14s linear infinite;
    }

    .logo-orbit-inner {
      width:100%;
      height:100%;
      border-radius:inherit;
      background:#020617;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.4rem;
    }

    @keyframes spin {
      to { transform:rotate(360deg); }
    }

    .logo-text-main {
      font-size:0.95rem;
      font-weight:700;
      letter-spacing:0.15em;
      text-transform:uppercase;
    }

    .logo-text-sub {
      font-size:0.7rem;
      color:var(--muted);
    }

    nav {
      display:flex;
      flex-wrap:wrap;
      gap:0.4rem;
      justify-content:flex-end;
    }

    nav a {
      font-size:0.75rem;
      text-transform:uppercase;
      letter-spacing:0.14em;
      padding:0.3rem 0.6rem;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.4);
      color:var(--muted);
      text-decoration:none;
      transition:0.18s;
      background:rgba(15,23,42,0.7);
    }

    nav a:hover {
      color:var(--text);
      border-color:var(--accent3);
      box-shadow:0 0 0 1px rgba(56,189,248,0.4);
    }

    @media (max-width:800px) {
      .topbar { flex-direction:column; align-items:flex-start; }
      nav { justify-content:flex-start; }
    }

    main {
      max-width:1200px;
      margin:1.25rem auto 2.5rem;
      padding:0 1.25rem 2rem;
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:minmax(0,1.8fr) minmax(280px,1.1fr);
      gap:1.5rem;
    }

    @media (max-width:900px) {
      main { display:block; }
      .sidebar { margin-top:1.5rem; }
    }

    .section-card {
      border-radius:var(--radius);
      background:radial-gradient(circle at 0 0, #22c55e22 0, transparent 60%), var(--card);
      border:1px solid rgba(148,163,184,0.7);
      box-shadow:var(--shadow);
      padding:1rem 1rem 1.2rem;
      margin-bottom:1.1rem;
      position:relative;
      overflow:hidden;
    }

    .section-card::before {
      content:"";
      position:absolute;
      inset:-40%;
      background-image:radial-gradient(circle, rgba(56,189,248,0.18), transparent 60%);
      opacity:0.3;
      mix-blend-mode:screen;
      pointer-events:none;
    }

    .section-inner {
      position:relative;
      z-index:1;
    }

    .hero-badge {
      display:inline-flex;
      align-items:center;
      gap:0.3rem;
      font-size:0.7rem;
      letter-spacing:0.15em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .hero-badge span {
      width:7px;
      height:7px;
      border-radius:999px;
      background:var(--accent2);
    }

    h1 {
      margin:0.35rem 0 0.25rem;
      font-size:clamp(1.7rem, 2.4vw + 1rem, 2.4rem);
      letter-spacing:0.08em;
      text-transform:uppercase;
    }

    .hero-sub {
      font-size:0.9rem;
      color:var(--muted);
      max-width:35rem;
    }

    .hero-actions {
      margin-top:0.9rem;
      display:flex;
      flex-wrap:wrap;
      gap:0.6rem;
      align-items:center;
    }

    .btn {
      border-radius:999px;
      border:1px solid transparent;
      padding:0.45rem 1rem;
      font-size:0.8rem;
      letter-spacing:0.1em;
      text-transform:uppercase;
      background:linear-gradient(135deg, var(--accent2), var(--accent4));
      color:#020617;
      cursor:pointer;
      box-shadow:0 12px 26px rgba(0,0,0,0.7);
      display:inline-flex;
      align-items:center;
      gap:0.4rem;
      transition:0.18s transform, 0.18s box-shadow, 0.18s filter;
    }

    .btn:hover {
      transform:translateY(-1px) scale(1.01);
      filter:brightness(1.05);
      box-shadow:0 16px 32px rgba(0,0,0,0.85);
    }

    .btn-ghost {
      background:transparent;
      color:var(--accent3);
      border-color:rgba(148,163,184,0.7);
      box-shadow:none;
    }

    .btn-ghost:hover {
      background:rgba(15,23,42,0.8);
      box-shadow:0 10px 26px rgba(0,0,0,0.7);
    }

    .hero-meta {
      font-size:0.75rem;
      color:var(--muted);
    }

    .section-label {
      font-size:0.7rem;
      text-transform:uppercase;
      letter-spacing:0.14em;
      color:var(--accent3);
      margin-bottom:0.2rem;
    }

    h2 {
      font-size:1.2rem;
      margin:0 0 0.4rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
    }

    p {
      font-size:0.85rem;
      color:var(--muted);
      margin:0.25rem 0;
    }

    .tagline-weird {
      font-size:0.8rem;
      color:var(--accent4);
      margin-top:0.35rem;
    }

    .pill-row {
      display:flex;
      flex-wrap:wrap;
      gap:0.35rem;
      margin:0.45rem 0 0.6rem;
    }

    .pill {
      font-size:0.7rem;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.6);
      padding:0.15rem 0.6rem;
      background:rgba(15,23,42,0.8);
      color:var(--muted);
    }

    .pill.highlight {
      border-color:var(--accent1);
      color:var(--accent1);
      background:rgba(22,163,74,0.12);
    }

    .grid-2 {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:0.7rem;
      margin-top:0.4rem;
    }

    @media (max-width:720px) {
      .grid-2 { grid-template-columns:1fr; }
    }

    .card {
      border-radius:12px;
      border:1px solid rgba(148,163,184,0.7);
      background:rgba(15,23,42,0.9);
      padding:0.7rem;
      font-size:0.82rem;
      position:relative;
      overflow:hidden;
    }

    .card::before {
      content:"";
      position:absolute;
      inset:-30%;
      background:radial-gradient(circle, rgba(56,189,248,0.2), transparent 60%);
      opacity:0.3;
      pointer-events:none;
    }

    .card-inner {
      position:relative;
      z-index:1;
    }

    .badge {
      display:inline-block;
      font-size:0.7rem;
      text-transform:uppercase;
      letter-spacing:0.16em;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.7);
      padding:0.1rem 0.45rem;
      color:var(--muted);
      margin-bottom:0.25rem;
    }

    .badge.alt {
      border-color:var(--accent2);
      color:var(--accent2);
    }

    .inline-note {
      font-size:0.75rem;
      color:var(--muted);
    }

    ul {
      margin:0.25rem 0 0.2rem 1.1rem;
      padding:0;
      font-size:0.8rem;
      color:var(--muted);
    }

    li { margin:0.12rem 0; }

    .quote {
      border-left:2px solid rgba(148,163,184,0.9);
      padding-left:0.6rem;
      margin:0.5rem 0;
      font-size:0.8rem;
      font-style:italic;
      color:#e5e7eb;
    }

    .quote small {
      display:block;
      margin-top:0.2rem;
      font-size:0.7rem;
      color:var(--muted);
      font-style:normal;
    }

    details {
      margin-top:0.45rem;
      border-radius:12px;
      border:1px dashed rgba(148,163,184,0.8);
      background:rgba(15,23,42,0.95);
      padding:0.4rem 0.6rem 0.55rem;
      font-size:0.8rem;
    }

    details summary {
      cursor:pointer;
      list-style:none;
      font-weight:600;
      color:var(--accent3);
    }

    details[open] {
      border-style:solid;
      background:rgba(15,23,42,0.9);
    }

    .avatar-row {
      display:flex;
      flex-wrap:wrap;
      gap:0.7rem;
      margin:0.6rem 0;
    }

    .avatar-card {
      flex:1 1 120px;
      min-width:0;
      border-radius:12px;
      border:1px dashed rgba(148,163,184,0.7);
      padding:0.4rem;
      font-size:0.78rem;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .avatar-title {
      font-size:0.8rem;
      font-weight:600;
      margin-bottom:0.15rem;
    }

    .avatar-tag {
      font-size:0.68rem;
      color:var(--muted);
      margin-bottom:0.2rem;
    }

    .avatar-img {
      width:100%;
      max-height:110px;
      object-fit:cover;
      border-radius:9px;
      border:1px solid rgba(148,163,184,0.8);
      margin-top:0.2rem;
    }

    .inline-chip {
      display:inline-block;
      font-size:0.68rem;
      border-radius:999px;
      padding:0.12rem 0.4rem;
      border:1px solid rgba(148,163,184,0.7);
      color:var(--muted);
      margin-right:0.25rem;
    }

    .interstitial {
      margin-top:0.6rem;
      border-radius:14px;
      border:1px solid rgba(248,250,252,0.1);
      background:linear-gradient(135deg, rgba(56,189,248,0.12), rgba(248,113,113,0.12));
      padding:0.6rem 0.7rem;
      font-size:0.8rem;
    }

    .interstitial strong {
      color:#fbbf24;
    }

    .interstitial button {
      margin-top:0.3rem;
      border-radius:999px;
      padding:0.25rem 0.7rem;
      border:1px solid rgba(248,250,252,0.7);
      background:rgba(15,23,42,0.9);
      color:var(--accent3);
      font-size:0.75rem;
      cursor:pointer;
    }

    .mini-quiz {
      margin-top:0.7rem;
      border-radius:12px;
      border:1px solid rgba(148,163,184,0.7);
      background:rgba(15,23,42,0.95);
      padding:0.6rem 0.7rem;
      font-size:0.8rem;
    }

    .mini-quiz-question {
      font-weight:600;
      margin-bottom:0.25rem;
    }

    .mini-quiz-options label {
      display:block;
      cursor:pointer;
      margin-bottom:0.15rem;
    }

    .mini-quiz button {

      border-radius:999px;
      padding:0.2rem 0.65rem;
